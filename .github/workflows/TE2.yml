name: Test Tethers#main (macOS)

on:
  schedule:
    - cron: '0 8 * * *'   # Runs every day at 8am UTC
  workflow_dispatch:      # Allows manual trigger from the Actions tab

jobs:
  run-script:
    runs-on: macos-latest
    steps:
      - name: Show memory, disk and CPU
        run: |
          # macOS creates swap files on demand on the VM volume, so no swap is set up here
          echo "RAM: $(( $(sysctl -n hw.memsize) / 1048576 ))MB"
          sysctl vm.swapusage
          df -h /System/Volumes/VM 2>/dev/null || df -h /
          echo "CPU: $(sysctl -n machdep.cpu.brand_string) ($(sysctl -n hw.ncpu) cores)"
      - name: Checkout code
        uses: actions/checkout@v6
      - uses: julia-actions/install-juliaup@v3
        with:
          channel: '1'
      - name: Run script test_tethers
        run: |
          # Memory in MB from vm_stat: used = active + wired + compressed (RAM used by the compressor)
          mem_used() {
            vm_stat | awk -v ps="$(sysctl -n hw.pagesize)" '
              /Pages active/{a=$3} /Pages wired down/{w=$4} /occupied by compressor/{c=$5}
              END{printf "%d", (a+w+c)*ps/1048576}'
          }
          # Memory demand in MB: active + wired + the uncompressed size of the pages in the
          # compressor. This should be comparable with RAM + swap used on Linux; used + swap
          # counts compressed pages at their compressed size. Swap is not added, because macOS
          # swaps out compressed pages, which should still be counted as stored in the
          # compressor. Both are logged until this is verified.
          mem_demand() {
            vm_stat | awk -v ps="$(sysctl -n hw.pagesize)" '
              /Pages active/{a=$3} /Pages wired down/{w=$4} /stored in compressor/{s=$5}
              END{printf "%d", (a+w+s)*ps/1048576}'
          }
          # Memory compressor: uncompressed size -> RAM it occupies, in MB, and the ratio, like the
          # zram field on Linux. The compressed segments are what macOS writes to swap, so the
          # ratio says how much memory 1 GB of swap holds.
          comp_stat() {
            vm_stat | awk -v ps="$(sysctl -n hw.pagesize)" '
              /stored in compressor/{s=$5} /occupied by compressor/{c=$5}
              END{printf "comp=%d->%dMB ratio=%.1f", s*ps/1048576, c*ps/1048576, (c > 0 ? s/c : 0)}'
          }
          # Number of pages swapped in and out since boot
          swap_counts() {
            vm_stat | awk '/^Swapins/{i=$2} /^Swapouts/{o=$2} END{printf "%d %d", i, o}'
          }
          swap_used() {
            sysctl -n vm.swapusage | awk '{for (i = 1; i < NF; i++) if ($i == "used") {sub("M", "", $(i+2)); printf "%d", $(i+2)}}'
          }
          # Log memory, swap and CPU activity every 60 s. The samples go to a file, so that the
          # logger never blocks when the runner stops reading its output under heavy swapping;
          # tail shows them in the job log. The timestamp of a sample is when it was taken, the
          # prefix GitHub adds is when the runner received it.
          : > /tmp/memlog
          # si/so: swap in/out in KB/s since the previous sample, as from vmstat on Linux
          ( set +x; ps=$(sysctl -n hw.pagesize)
            read -r pi po <<< "$(swap_counts)"; pt=$(date +%s)
            while true; do
              read -r ci co <<< "$(swap_counts)"; ct=$(date +%s); dt=$(( ct > pt ? ct - pt : 1 ))
              si=$(( (ci - pi) * ps / 1024 / dt )); so=$(( (co - po) * ps / 1024 / dt ))
              pi=$ci; po=$co; pt=$ct
              echo "[mem $(date -u +%H:%M:%S)] used=$(mem_used)MB swap=$(swap_used)MB demand=$(mem_demand)MB $(comp_stat) si=$si so=$so $(top -l 2 -n 0 -s 5 | awk '/^CPU usage/{l=$0} END{split(l, f, ", "); sub(/% idle/, "", f[3]); printf "cpu=%d%%", 100-f[3]}')" >> /tmp/memlog
              sleep 55
            done ) &
          MEMLOG_PID=$!
          tail -f /tmp/memlog &
          TAIL_PID=$!
          # Track the peak memory demand every 2 s: RAM used + swap used, and demand as above
          ( set +x; peak=0; peak2=0; while true; do
              d=$(( $(mem_used) + $(swap_used) ))
              if [ "$d" -gt "$peak" ]; then peak=$d; echo "${peak}MB at $(date -u +%H:%M:%S)" > /tmp/mem_peak; fi
              d2=$(mem_demand)
              if [ "$d2" -gt "$peak2" ]; then peak2=$d2; echo "${peak2}MB at $(date -u +%H:%M:%S)" > /tmp/mem_peak2; fi
              sleep 2
            done ) &
          PEAK_PID=$!
          # Highest priority for the monitoring, also for the commands it starts from now on
          sudo renice -n -20 -p $MEMLOG_PID $PEAK_PID $TAIL_PID > /dev/null || true
          trap 'kill $MEMLOG_PID $PEAK_PID $TAIL_PID 2>/dev/null || true; echo "[mem peak] RAM + swap demand: $(cat /tmp/mem_peak 2>/dev/null)"; echo "[mem peak] demand (uncompressed): $(cat /tmp/mem_peak2 2>/dev/null)"' EXIT
          ./scripts/test_tethers
