name: Test Tethers#main

on:
  schedule:
    - cron: '0 8 * * *'   # Runs every day at 3am UTC
  workflow_dispatch:      # Allows manual trigger from the Actions tab

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Create swap space
        run: |
          sudo swapoff -a
          sudo dd if=/dev/zero of=/swapfile bs=1M count=32768
          sudo chmod 0600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "Swap created: $(swapon --show)"
      - name: Install matplotlib
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3-matplotlib
          fi
        shell: bash
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install mesa
        run: sudo apt-get update && sudo apt-get install -y xorg-dev mesa-utils xvfb libgl1 freeglut3-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev
      - uses: julia-actions/install-juliaup@v2
        with:
          channel: '1'
      - name: Run script test_tethers
        run: |
          DISPLAY=:0 xvfb-run -s '-screen 0 1024x768x24' ./scripts/test_tethers
