name: Install KiteModels (latest releases)

on:
  schedule:
    - cron: '0 6 * * *'   # Runs every day at 6am UTC
  workflow_dispatch:      # Allows manual trigger from the Actions tab

jobs:
  run-script:
    name: Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1', '1.12']
    steps:
      - name: Create swap space
        run: |
          sudo swapoff -a
          sudo dd if=/dev/zero of=/swapfile bs=1M count=38768
          sudo chmod 0600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "Swap created: $(swapon --show)"
      - name: Check RAM
        run: |
          echo "Total RAM:"
          free -m
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install mesa
        run: sudo apt-get update && sudo apt-get install -y xorg-dev mesa-utils xvfb libgl1 freeglut3-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev
      - uses: julia-actions/install-juliaup@v2
        with:
          channel: ${{ matrix.julia-version }}
      - name: Run script install_kitemodels
        run: |
          # Log memory and swap activity every 60 s (si/so = swap in/out in KB/s)
          ( while true; do
              echo "[mem $(date -u +%H:%M:%S)] $(free -m | awk '/^Mem/{printf "used=%dMB avail=%dMB", $3, $7} /^Swap/{printf " swap=%dMB", $3}') $(vmstat 5 2 | awk 'END{printf "si=%s so=%s", $7, $8}')"
              sleep 55
            done ) &
          MEMLOG_PID=$!
          trap 'kill $MEMLOG_PID 2>/dev/null || true' EXIT
          DISPLAY=:0 xvfb-run -s '-screen 0 1024x768x24' ./scripts/install_kitemodels
