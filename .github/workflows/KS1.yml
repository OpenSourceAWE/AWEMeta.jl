name: Install KiteSimulators (latest release) using Julia 1.11

on:
  schedule:
    - cron: '0 7 * * *'   # Runs every day at 2am UTC
  workflow_dispatch:      # Allows manual trigger from the Actions tab

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Create swap space (zram + swap file)
        run: |
          sudo swapoff -a
          # Fast tier: compressed swap in RAM, used first
          sudo modprobe zram || { sudo apt-get update && sudo apt-get install -y linux-modules-extra-$(uname -r) && sudo modprobe zram; }
          echo zstd | sudo tee /sys/block/zram0/comp_algorithm
          echo 20G  | sudo tee /sys/block/zram0/disksize
          sudo mkswap /dev/zram0
          sudo swapon -p 100 /dev/zram0
          # Slow tier: disk swap file, only used when zram is full
          sudo fallocate -l 16G /swapfile
          sudo chmod 0600 /swapfile
          sudo mkswap /swapfile
          sudo swapon -p 10 /swapfile
          echo 180 | sudo tee /proc/sys/vm/swappiness
          echo "Swap created:"; swapon --show
          echo "CPU: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs) ($(nproc) cores)"
      - name: Install matplotlib
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3-matplotlib
          fi
        shell: bash
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install mesa
        run: sudo apt-get update && sudo apt-get install -y xorg-dev mesa-utils xvfb libgl1 freeglut3-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev
      - name: Install juliaup (with retry)
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: |
            curl -fsSL https://install.julialang.org | sh -s -- --yes --default-channel 1.11
      - name: Add juliaup to PATH
        run: echo "$HOME/.juliaup/bin" >> $GITHUB_PATH
      - name: Run script install_kitesimulators
        run: |
          DISPLAY=:0 xvfb-run -s '-screen 0 1024x768x24' ./scripts/install_kitesimulators
