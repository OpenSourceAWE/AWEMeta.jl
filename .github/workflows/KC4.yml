name: Test KiteControllers#main --update

on:
  schedule:
    - cron: '0 4 * * *'   # Runs every day at 4am UTC
  workflow_dispatch:      # Allows manual trigger from the Actions tab

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Create swap space (zram + swap file)
        run: |
          sudo swapoff -a
          # Fast tier: compressed swap in RAM, used first
          sudo modprobe zram || { sudo apt-get update && sudo apt-get install -y linux-modules-extra-$(uname -r) && sudo modprobe zram; }
          echo zstd | sudo tee /sys/block/zram0/comp_algorithm
          echo 20G  | sudo tee /sys/block/zram0/disksize
          sudo mkswap /dev/zram0
          sudo swapon -p 100 /dev/zram0
          # Slow tier: disk swap file, only used when zram is full
          sudo fallocate -l 16G /swapfile
          sudo chmod 0600 /swapfile
          sudo mkswap /swapfile
          sudo swapon -p 10 /swapfile
          echo 180 | sudo tee /proc/sys/vm/swappiness
          echo "Swap created:"; swapon --show
          echo "CPU: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs) ($(nproc) cores)"
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install mesa
        run: sudo apt-get update && sudo apt-get install -y xorg-dev mesa-utils xvfb libgl1 freeglut3-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev
      - uses: julia-actions/install-juliaup@v3
        with:
          channel: '1'
      - name: Run script test_kitecontrollers_main-update
        run: |
          DISPLAY=:0 xvfb-run -s '-screen 0 1024x768x24' ./scripts/test_kitecontrollers_main-update
