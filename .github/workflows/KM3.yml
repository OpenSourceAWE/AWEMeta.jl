name: Install KiteModels#main

on:
  schedule:
    - cron: '0 5 * * *'   # Runs every day at 5am UTC
  workflow_dispatch:      # Allows manual trigger from the Actions tab

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Create swap space (zram + swap file)
        run: |
          sudo swapoff -a
          # Fast tier: compressed swap in RAM, used first
          sudo modprobe zram || { sudo apt-get update && sudo apt-get install -y linux-modules-extra-$(uname -r) && sudo modprobe zram; }
          echo zstd | sudo tee /sys/block/zram0/comp_algorithm
          echo 20G  | sudo tee /sys/block/zram0/disksize
          sudo mkswap /dev/zram0
          sudo swapon -p 100 /dev/zram0
          # Slow tier: disk swap file, only used when zram is full
          sudo fallocate -l 16G /swapfile
          sudo chmod 0600 /swapfile
          sudo mkswap /swapfile
          sudo swapon -p 10 /swapfile
          echo 180 | sudo tee /proc/sys/vm/swappiness
          echo "Swap created:"; swapon --show
      - name: Check RAM
        run: |
          echo "Total RAM:"
          free -m
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install mesa
        run: sudo apt-get update && sudo apt-get install -y xorg-dev mesa-utils xvfb libgl1 freeglut3-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev
      - uses: julia-actions/install-juliaup@v3
        with:
          channel: '1'
      - name: Run script install_kitemodels_main
        run: |
          set -euxo pipefail

          # Log memory and swap activity every 60 s (si/so = swap in/out in KB/s)
          ( set +x; while true; do
              echo "[mem $(date -u +%H:%M:%S)] $(free -m | awk '/^Mem/{printf "used=%dMB avail=%dMB", $3, $7} /^Swap/{printf " swap=%dMB", $3}') zram=$(zramctl --noheadings --output DATA,COMPR /dev/zram0 | awk '{print $1 "->" $2}') $(vmstat 5 2 | awk 'END{printf "si=%s so=%s", $7, $8}')"
              sleep 55
            done ) &
          MEMLOG_PID=$!
          trap 'kill $MEMLOG_PID 2>/dev/null || true' EXIT
          # Run and capture output
          if ! xvfb-run -a -s '-screen 0 1024x768x24' ./scripts/install_kitemodels_main |& tee install_kitemodels_main.log; then
            echo "install_kitemodels_main failed; tailing log:"
            tail -n 200 install_kitemodels_main.log || true
            exit 1
          fi
      - name: Upload install_kitemodels_main log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: install_kitemodels_main-log
          path: install_kitemodels_main.log
